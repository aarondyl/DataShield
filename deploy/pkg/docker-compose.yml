services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: datashield-postgres
    environment:
      POSTGRES_USER: datashield
      POSTGRES_PASSWORD: datashield
      POSTGRES_DB: datashield
    ports:
      - "5432:5432"
    volumes:
      - datashield_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashield"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: datashield-app
    environment:
      DATABASE_URL: postgresql+psycopg://datashield:datashield@postgres:5432/datashield
      RUN_SEED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datashield_data:
