name: Audit Simple Application Server

on:
  workflow_dispatch:

permissions: {}

jobs:
  ssh-test:
    name: Read-only production host audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test-ssh
    timeout-minutes: 5

    steps:
      - name: Verify SSH connectivity
        shell: bash
        env:
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_PORT: ${{ vars.ECS_PORT }}
          ECS_USER: ${{ vars.ECS_USER }}
          ECS_KNOWN_HOSTS: ${{ vars.ECS_KNOWN_HOSTS }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$ECS_HOST"
          test "$ECS_USER" = "deploy"
          test "$ECS_PORT" = "22"
          test -n "$ECS_KNOWN_HOSTS"
          test -n "$ECS_SSH_KEY"

          mkdir -p "$HOME/.ssh"
          KEY_FILE="$(mktemp "$HOME/.ssh/ci-key.XXXXXXXX")"
          HOSTS_FILE="$(mktemp "$HOME/.ssh/known-hosts.XXXXXXXX")"

          trap 'rm -f "$KEY_FILE" "$HOSTS_FILE"' EXIT

          printf '%s\n' "$ECS_SSH_KEY" > "$KEY_FILE"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$HOSTS_FILE"

          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOSTS_FILE" \
            -o ConnectTimeout=10 \
            -i "$KEY_FILE" \
            -p "$ECS_PORT" \
            "$ECS_USER@$ECS_HOST" \
            'bash -s' <<'REMOTE'
          set -eu
          printf 'user='; id -un
          printf 'host='; hostname
          printf 'uptime='; uptime
          . /etc/os-release
          printf 'os=%s\n' "$PRETTY_NAME"
          printf 'memory_mb='; awk '/MemTotal/ {printf "%.0f\n", $2 / 1024}' /proc/meminfo
          printf 'root_disk='; df -h / | tail -n 1
          for path in /opt/datashield /opt/datashield/secrets /opt/datashield/secrets/cloud.env /opt/datashield-cloud /opt/datashield-cloud/secrets; do
            if [ -e "$path" ]; then stat -c 'path=%n mode=%a owner=%U:%G type=%F' "$path"; else printf 'path=%s state=missing\n' "$path"; fi
          done
          echo 'datashield_service:'
          systemctl show datashield.service --no-pager \
            -p LoadState -p ActiveState -p SubState -p UnitFileState \
            -p FragmentPath -p User -p Group -p WorkingDirectory -p Restart -p MainPID \
            -p EnvironmentFiles 2>/dev/null || true
          main_pid=$(systemctl show datashield.service -p MainPID --value 2>/dev/null || echo 0)
          case "$main_pid" in ''|0) ;; *) if [ -e "/proc/$main_pid/exe" ]; then printf 'datashield_executable='; readlink -f "/proc/$main_pid/exe"; fi ;; esac
          echo 'related_running_services:'
          systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei 'datashield|docker|nginx|caddy|postgres' || true
          printf 'docker_binary='; command -v docker || echo unavailable
          printf 'docker_service='; systemctl is-active docker 2>/dev/null || true
          printf 'compose_binary='; command -v docker-compose || echo unavailable
          printf 'host_firewall_service='; systemctl is-active firewalld 2>/dev/null || echo unavailable
          if command -v ss >/dev/null 2>&1; then
            echo 'listening_tcp_ports:'
            ss -lnt
          fi
          echo 'deploy_sudo_allowlist:'
          sudo -n -l 2>&1 || true
          if curl --silent --show-error --max-time 6 --output /dev/null --write-out 'local_api_http=%{http_code}\n' http://127.0.0.1:8000/api/health; then
            :
          else
            echo 'local_api_http=unavailable'
          fi
          DOCKER_USE_SUDO=0
          if docker_version=$(docker version --format '{{.Server.Version}}' 2>/dev/null); then
            :
          elif docker_version=$(sudo -n docker version --format '{{.Server.Version}}' 2>/dev/null); then
            DOCKER_USE_SUDO=1
          else
            docker_version=unavailable
            DOCKER_USE_SUDO=-1
          fi
          run_docker() {
            if [ "$DOCKER_USE_SUDO" = 1 ]; then sudo -n docker "$@"; else docker "$@"; fi
          }
          printf 'docker=%s\n' "$docker_version"
          if [ "$DOCKER_USE_SUDO" = -1 ]; then
            echo 'docker_access=denied'
            echo 'containers=unavailable'
            echo 'postgres_summary=unavailable'
          else
            printf 'docker_sudo=%s\n' "$DOCKER_USE_SUDO"
            printf 'compose='; run_docker compose version --short 2>/dev/null || echo unavailable
            printf 'containers:\n'
            run_docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            pg_container=$(run_docker ps --quiet --filter label=com.docker.compose.service=postgres | head -n 1)
            if [ -n "$pg_container" ]; then
              echo 'postgres_summary:'
              run_docker exec -i "$pg_container" sh -c 'psql -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-postgres}" -At' <<'SQL'
          SELECT 'database=' || current_database();
          SELECT 'schema_revision=' || COALESCE((SELECT version_num FROM alembic_version LIMIT 1), 'missing');
          SELECT 'pgvector=' || COALESCE((SELECT extversion FROM pg_extension WHERE extname = 'vector'), 'missing');
          SELECT 'regulations=' || count(*) FROM regulations;
          SELECT 'versions=' || count(*) FROM regulation_versions;
          SELECT 'legal_units=' || count(*) FROM legal_units;
          SELECT 'requirements=' || count(*) FROM requirements;
          SELECT 'change_events=' || count(*) FROM regulation_events;
          SQL
            else
              echo 'postgres_container=not_found'
            fi
          fi
          REMOTE

          if code="$(curl --silent --show-error --connect-timeout 6 --max-time 10 --output /dev/null --write-out '%{http_code}' https://api.datashield.ltd/api/health 2>/dev/null)"; then
            echo "external_api_http=$code"
          else
            echo 'external_api_http=unavailable'
          fi
