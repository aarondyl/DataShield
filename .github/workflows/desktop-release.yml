name: DataShield Desktop Pre-release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 固定的 main Commit SHA（完整 40 位）
        required: true
        type: string
      version:
        description: 新 SemVer 预发布版本，例如 0.2.0-rc.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: 校验 main 提交与新版本号
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          ! git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1
          test "$(python -c 'import json;print(json.load(open("apps/desktop/package.json"))["version"])')" = "$VERSION"
          test "$(grep '^version = ' apps/desktop/src-tauri/Cargo.toml | head -1 | cut -d '\"' -f2)" = "$VERSION"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: backend
  windows:
    needs: validate
    uses: ./.github/workflows/desktop-windows.yml
    with:
      source_ref: ${{ inputs.source_sha }}
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: DataShield-Windows-Installer
          path: release-assets
      - name: 核对来源并发布新的预发布版本
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(tr -d '\r\n\357\273\277' < release-assets/SOURCE_COMMIT.txt)" = "$SOURCE_SHA"
          TAG="v$VERSION"
          ! gh release view "$TAG" >/dev/null 2>&1
          cp docs/DESKTOP_RELEASE_NOTES.md release-notes.md
          printf '\n\nSource Commit: `%s`\n' "$SOURCE_SHA" >> release-notes.md
          gh release create "$TAG" release-assets/* --prerelease --target "$SOURCE_SHA" --title "DataShield Desktop $TAG" --notes-file release-notes.md
