name: Product Twin validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: datashield
          POSTGRES_PASSWORD: datashield
          POSTGRES_DB: datashield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datashield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r backend/requirements-identity.txt
      - name: Validate PostgreSQL migration
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://datashield:datashield@localhost:5432/datashield
        run: |
          python -m alembic upgrade head
          python -c 'from sqlalchemy import create_engine, inspect; import os; i = inspect(create_engine(os.environ["DATABASE_URL"])); assert {"product_twin_versions", "product_twin_facts", "product_twin_analysis_refs", "product_twin_decisions", "tenant_agent_runs", "findings", "finding_requirements", "finding_evidence", "tenant_missing_context_items", "remediations", "remediation_requirements", "remediation_evidence", "feedback", "feedback_candidates", "feedback_candidate_requirements", "evaluation_sessions"} <= set(i.get_table_names()); assert "product_id" in {c["name"] for c in i.get_columns("product_understanding_jobs")}'
          python scripts/smoke_product_twin_db.py
          python scripts/smoke_tenant_intelligence_db.py
      - name: PostgreSQL Remediation smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://datashield:datashield@localhost:5432/datashield
        run: python scripts/smoke_remediation_db.py
      - name: PostgreSQL Feedback Loop smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://datashield:datashield@localhost:5432/datashield
        run: python scripts/smoke_feedback_loop_db.py
      - name: Validate SQLite migration
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/datashield-product-twin-ci.db
        run: python -m alembic upgrade head
      - name: Validate isolated Identity migration
        working-directory: backend
        env:
          IDENTITY_DATABASE_URL: sqlite:////tmp/datashield-identity-ci.db
        run: |
          python -m alembic -c alembic-identity.ini upgrade head
          python -c 'from sqlalchemy import create_engine, inspect; i=inspect(create_engine("sqlite:////tmp/datashield-identity-ci.db")); t=set(i.get_table_names()); assert {"identity_users", "identity_sessions", "identity_organizations", "identity_memberships", "identity_audit_events"} <= t; assert not ({"companies", "products", "regulations", "findings", "remediations"} & t)'
      - name: Run backend tests
        working-directory: backend
        env:
          IDENTITY_DATABASE_URL: sqlite:////tmp/datashield-identity-tests-ci.db
        run: python -m pytest tests -q
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
