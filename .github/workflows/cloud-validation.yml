name: Cloud RegIntel validation

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.cloud.yml'
      - 'deploy/**'
      - '.dockerignore'
      - 'backend/.dockerignore'
      - '.github/workflows/cloud-validation.yml'
      - '.github/workflows/cloud-deploy.yml'
      - '.github/workflows/test-ssh.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.cloud.yml'
      - 'deploy/**'
      - '.dockerignore'
      - 'backend/.dockerignore'
      - '.github/workflows/cloud-validation.yml'
      - '.github/workflows/cloud-deploy.yml'
      - '.github/workflows/test-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-contract-and-migration:
    name: Cloud-only contract and pgvector migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: datashield_cloud
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: datashield_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datashield_cloud -d datashield_cloud"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloud dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate Cloud-only PostgreSQL migration
        working-directory: backend
        env:
          RUNTIME_MODE: cloud
          DATABASE_URL: postgresql+psycopg://datashield_cloud:ci-only-not-production@localhost:5432/datashield_cloud
        run: |
          python -m alembic -c alembic-cloud.ini upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          tables = set(inspect(engine).get_table_names())
          assert {"regulations", "regulation_events", "legal_chunks", "requirements"} <= tables
          assert not ({"companies", "products", "findings", "remediations", "feedback"} & tables)
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1 FROM pg_extension WHERE extname = 'vector'")).scalar() == 1
          PY
      - name: Validate Cloud API contract and Local sync behavior
        working-directory: backend
        run: python -m pytest tests/test_cloud_api_contract.py tests/test_cloud_migration_isolation.py tests/test_local_regulation_cache.py tests/test_local_sync_http_e2e.py -q
      - name: Validate startup Secret handling and migration rollback contract
        run: |
          python -m pytest backend/tests/test_cloud_startup_env_validation.py backend/tests/test_identity_startup_env_validation.py -q
          python -m pytest backend/tests/test_alembic_config_url.py deploy/tests/test_cloud_deploy_workflow.py deploy/tests/test_cloud_deploy_state.py deploy/tests/test_cloud_readonly_diagnostics.py deploy/tests/test_migration_rehearsal.py -q
          python deploy/check-additive-migrations.py
          python -m py_compile deploy/verify-cloud-migrations.py
          bash -n deploy/prepare-cloud-secrets.sh deploy/check-cloud-config.sh deploy/install-cloud-host.sh deploy/datashield-cloud-deploy deploy/cloud-deploy-state.sh
          bash deploy/tests/test-container-id-normalization.sh
      - name: Build isolated Cloud Backend image
        run: docker build --file backend/Dockerfile.cloud --tag datashield-cloud-ci:${{ github.sha }} backend
      - name: Verify Cloud image excludes Desktop and private Local payloads
        run: |
          docker run --rm --entrypoint sh datashield-cloud-ci:${{ github.sha }} -ec 'test ! -e /app/frontend && test ! -e /app/apps && test ! -e /app/desktop_sidecar.py && test -d /app/app/regintel && test -d /app/alembic_cloud'
      - name: Build isolated Identity image
        run: docker build --file backend/Dockerfile.identity --tag datashield-identity-ci:${{ github.sha }} backend
      - name: Verify Identity image excludes RegIntel and Desktop payloads
        run: |
          docker run --rm --entrypoint sh datashield-identity-ci:${{ github.sha }} -ec 'test ! -e /app/frontend && test ! -e /app/alembic_cloud && test ! -e /app/app/regintel && test -d /app/identity_service && test -f /app/app/core/passwords.py'
      - name: Build and validate HTTPS gateway image
        run: |
          docker build --file deploy/proxy/Dockerfile --tag datashield-cloud-proxy-ci:${{ github.sha }} deploy/proxy
          docker run --rm --entrypoint caddy -e CLOUD_DOMAIN=api.datashield.ltd datashield-cloud-proxy-ci:${{ github.sha }} validate --config /etc/caddy/Caddyfile
      - name: Validate Cloud Compose definition without exposing configuration
        run: |
          mkdir -p /tmp/datashield-compose-secrets
          for secret in postgres_password cloud_database_url cloud_admin_token identity_database_url identity_smtp_password identity_llm_api_key; do : > "/tmp/datashield-compose-secrets/$secret"; done
          docker compose --env-file deploy/cloud.env.example --env-file <(printf 'CLOUD_SECRETS_DIR=/tmp/datashield-compose-secrets\nCLOUD_IMAGE=datashield-cloud:ci\nIDENTITY_IMAGE=datashield-identity:ci\nPROXY_IMAGE=datashield-proxy:ci\n') -f docker-compose.cloud.yml config --quiet
