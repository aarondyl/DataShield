name: Desktop Windows 安装包

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'backend/app/**'
      - 'backend/desktop_sidecar.py'
      - 'backend/datashield-local.spec'
      - 'backend/requirements*.txt'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: 构建 Windows sidecar 与 NSIS 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: 安装 sidecar 构建依赖
        working-directory: backend
        run: python -m pip install -r requirements-desktop.txt
      - name: 打包 Local FastAPI sidecar
        working-directory: backend
        run: python -m PyInstaller --noconfirm --clean datashield-local.spec
      - name: 放置 Tauri sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item backend/dist/datashield-local/datashield-local.exe apps/desktop/src-tauri/binaries/datashield-local-x86_64-pc-windows-msvc.exe
          Copy-Item -Recurse backend/dist/datashield-local/_internal apps/desktop/src-tauri/binaries/_internal
      - name: 验证打包后的 sidecar 启动与安全契约
        shell: pwsh
        run: ./scripts/smoke-desktop-sidecar.ps1 -Executable backend/dist/datashield-local/datashield-local.exe
      - name: 安装 Desktop 依赖
        run: npm --prefix apps/desktop ci
      - name: 验证 Desktop 业务交互与中英文词条
        run: npm --prefix apps/desktop test -- --maxWorkers=1
      - name: 构建 NSIS 当前用户安装包
        run: npm --prefix apps/desktop run tauri -- build
      - name: 上传 Windows 安装产物
        uses: actions/upload-artifact@v4
        with:
          name: DataShield-Windows-Installer
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
