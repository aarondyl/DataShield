name: Publish and deploy Cloud

on:
  workflow_run:
    workflows: [Cloud RegIntel validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Read-only audit or publish and deploy validated main
        type: choice
        options: [audit, deploy]
        default: audit
        required: true
      source_sha:
        description: Full main Commit SHA for a previously validated deployment candidate
        type: string
        required: false
      compose_sha256:
        description: SHA256 of docker-compose.cloud.yml from source_sha
        type: string
        required: false
      cloud_digest:
        description: Approved sha256 digest for datashield-cloud
        type: string
        required: false
      identity_digest:
        description: Approved sha256 digest for datashield-identity
        type: string
        required: false
      proxy_digest:
        description: Approved sha256 digest for datashield-cloud-proxy
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: datashield-cloud-production
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'audit'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Run restricted host audit
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ECS_HOST" && test "$ECS_USER" = admin && test "$ECS_PORT" = 22
          test -n "$ECS_KNOWN_HOSTS" && test -n "$ECS_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          key="$(mktemp "$HOME/.ssh/key.XXXXXXXX")"
          hosts="$(mktemp "$HOME/.ssh/hosts.XXXXXXXX")"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$ECS_SSH_KEY" > "$key"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$hosts"
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$key" -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" 'if [ -x /usr/local/sbin/datashield-cloud-deploy ]; then sudo -n /usr/local/sbin/datashield-cloud-deploy audit; else echo deploy_wrapper=not_installed; fi'

  build-and-publish:
    name: Build and publish immutable Cloud images
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      cloud_digest: ${{ steps.cloud.outputs.digest }}
      identity_digest: ${{ steps.identity.outputs.digest }}
      proxy_digest: ${{ steps.proxy.outputs.digest }}
      compose_sha: ${{ steps.compose.outputs.sha256 }}
    env:
      GHCR_OWNER: aarondyl
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Confirm validated commit is current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full 40-character source commit SHA.'; exit 1; }
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$SOURCE_SHA" = "$current_main" || { echo 'Publishing skipped: validated commit is no longer main HEAD.'; exit 1; }
          test "$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")" = "$SOURCE_SHA"
          test "$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")" = main
          test "$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")" = push
          test "$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")" = success
      - name: Record full validated source SHA
        id: source
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf '## Published DataShield Cloud images\n\nSource commit: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Record Compose file hash from validated source
        id: compose
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f docker-compose.cloud.yml && test ! -L docker-compose.cloud.yml
          compose_sha="$(sha256sum docker-compose.cloud.yml | awk '{print $1}')"
          [[ "$compose_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$compose_sha" >> "$GITHUB_OUTPUT"
          printf 'Compose file SHA256: `%s`\n\n' "$compose_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR for image publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish datashield-cloud
        id: cloud
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.cloud
          push: true
          # BuildKit's timestamped provenance manifest changed the top-level
          # digest on same-SHA rebuilds; the deploy path records the image digest.
          provenance: false
          tags: ghcr.io/aarondyl/datashield-cloud:${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Build and publish datashield-identity
        id: identity
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.identity
          push: true
          provenance: false
          tags: ghcr.io/aarondyl/datashield-identity:${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Build and publish datashield-cloud-proxy
        id: proxy
        uses: docker/build-push-action@v6
        with:
          context: deploy/proxy
          file: deploy/proxy/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/aarondyl/datashield-cloud-proxy:${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Verify and record image digests
        env:
          CLOUD_DIGEST: ${{ steps.cloud.outputs.digest }}
          IDENTITY_DIGEST: ${{ steps.identity.outputs.digest }}
          PROXY_DIGEST: ${{ steps.proxy.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$CLOUD_DIGEST" "$IDENTITY_DIGEST" "$PROXY_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Image publisher returned an invalid digest.'; exit 1; }
          done
          {
            printf '| Image | Immutable reference | Digest |\n|---|---|---|\n'
            printf '| datashield-cloud | `ghcr.io/%s/datashield-cloud@%s` | `%s` |\n' "$GHCR_OWNER" "$CLOUD_DIGEST" "$CLOUD_DIGEST"
            printf '| datashield-identity | `ghcr.io/%s/datashield-identity@%s` | `%s` |\n' "$GHCR_OWNER" "$IDENTITY_DIGEST" "$IDENTITY_DIGEST"
            printf '| datashield-cloud-proxy | `ghcr.io/%s/datashield-cloud-proxy@%s` | `%s` |\n' "$GHCR_OWNER" "$PROXY_DIGEST" "$PROXY_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-approved-candidate:
    name: Validate explicitly pinned deployment candidate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      compose_sha: ${{ steps.candidate.outputs.compose_sha }}
      cloud_digest: ${{ steps.candidate.outputs.cloud_digest }}
      identity_digest: ${{ steps.candidate.outputs.identity_digest }}
      proxy_digest: ${{ steps.candidate.outputs.proxy_digest }}
    steps:
      - name: Check out the requested candidate before using GitHub CLI
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Authenticate read-only to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate candidate commit, CI result, Compose hash, and pinned image metadata
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPOSE_SHA256: ${{ inputs.compose_sha256 }}
          CLOUD_DIGEST: ${{ inputs.cloud_digest }}
          IDENTITY_DIGEST: ${{ inputs.identity_digest }}
          PROXY_DIGEST: ${{ inputs.proxy_digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPOSE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CLOUD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$IDENTITY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PROXY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$SOURCE_SHA"
          successful_runs="$(gh run list --workflow cloud-validation.yml --branch main --commit "$SOURCE_SHA" --status success --json headSha --jq "[.[] | select(.headSha == \"$SOURCE_SHA\")] | length")"
          [[ "$successful_runs" =~ ^[1-9][0-9]*$ ]]
          actual_compose_sha="$(sha256sum docker-compose.cloud.yml | awk '{print $1}')"
          test "$actual_compose_sha" = "$COMPOSE_SHA256"
          for pair in \
            "datashield-cloud:$CLOUD_DIGEST" \
            "datashield-identity:$IDENTITY_DIGEST" \
            "datashield-cloud-proxy:$PROXY_DIGEST"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            image="ghcr.io/aarondyl/$name@$digest"
            docker pull "$image" >/dev/null 2>&1 || { echo "Candidate image unavailable: $name"; exit 1; }
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            test "$revision" = "$SOURCE_SHA" || { echo "Candidate image revision mismatch: $name"; exit 1; }
          done
          printf 'source_sha=%s\ncompose_sha=%s\ncloud_digest=%s\nidentity_digest=%s\nproxy_digest=%s\n' \
            "$SOURCE_SHA" "$COMPOSE_SHA256" "$CLOUD_DIGEST" "$IDENTITY_DIGEST" "$PROXY_DIGEST" >> "$GITHUB_OUTPUT"
          {
            printf '## Manually approved Cloud deployment candidate\n\n'
            printf 'Source Commit: `%s`\n\nCompose SHA256: `%s`\n\n' "$SOURCE_SHA" "$COMPOSE_SHA256"
            printf '| Image | Fixed digest |\n|---|---|\n'
            printf '| datashield-cloud | `%s` |\n' "$CLOUD_DIGEST"
            printf '| datashield-identity | `%s` |\n' "$IDENTITY_DIGEST"
            printf '| datashield-cloud-proxy | `%s` |\n' "$PROXY_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy published digests to production
    needs: [build-and-publish, validate-approved-candidate]
    if: >-
      !cancelled()
      && vars.CLOUD_DEPLOY_ENABLED == 'true'
      && ((github.event_name == 'workflow_run' && needs.build-and-publish.result == 'success'
           && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
           && github.event.workflow_run.head_branch == 'main')
          || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
              && github.ref == 'refs/heads/main' && needs.validate-approved-candidate.result == 'success'))
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || needs.build-and-publish.outputs.source_sha }}
      CLOUD_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_digest || needs.build-and-publish.outputs.cloud_digest }}
      IDENTITY_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_digest || needs.build-and-publish.outputs.identity_digest }}
      PROXY_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy_digest || needs.build-and-publish.outputs.proxy_digest }}
      COMPOSE_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.compose_sha256 || needs.build-and-publish.outputs.compose_sha }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_PORT: ${{ secrets.ECS_PORT }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
    steps:
      - name: Confirm published source is still current main and digests are immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$ECS_USER" = admin && test "$ECS_PORT" = 22
          test -n "$ECS_HOST" && test -n "$ECS_KNOWN_HOSTS" && test -n "$ECS_SSH_KEY"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$SOURCE_SHA" = "$current_main" || { echo 'Deployment skipped: published source is no longer main HEAD.'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLOUD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$IDENTITY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PROXY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$COMPOSE_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Checkout the same validated Compose commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Deploy digest-pinned images through restricted root wrapper
        id: remote
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash deploy/ci-transfer-cloud-compose.sh \
            "$SOURCE_SHA" "$COMPOSE_SHA256" "$CLOUD_DIGEST" "$IDENTITY_DIGEST" "$PROXY_DIGEST" \
            "$GITHUB_WORKSPACE/docker-compose.cloud.yml"
      - name: Verify public HTTPS API and registration service
        id: smoke
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused https://api.datashield.ltd/api/health | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("db")=="postgresql"'
          curl --fail --silent --show-error https://api.datashield.ltd/identity/health | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("database")=="postgresql" and d.get("email_delivery_ready")'
          curl --fail --silent --show-error 'https://api.datashield.ltd/api/v1/regulations?limit=1' >/dev/null
      - name: Restore last good application images if public smoke fails
        if: failure() && steps.remote.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          key="$(mktemp "$HOME/.ssh/key.XXXXXXXX")"
          hosts="$(mktemp "$HOME/.ssh/hosts.XXXXXXXX")"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$ECS_SSH_KEY" > "$key"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$hosts"
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$key" -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" \
            'sudo -n /usr/local/sbin/datashield-cloud-deploy rollback'
