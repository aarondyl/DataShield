services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: datashield_cloud
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: datashield_cloud
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashield_cloud -d datashield_cloud"]
      interval: 5s
      timeout: 3s
      retries: 12
    secrets: [postgres_password]
    networks: [cloud_database]
    # 故意不发布宿主机端口：生产数据库只能由 cloud 服务访问。

  cloud:
    build:
      context: .
      dockerfile: backend/Dockerfile.cloud
    environment:
      DATABASE_URL_FILE: /run/secrets/cloud_database_url
      RUNTIME_MODE: cloud
      RUN_SEED: "false"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
    ports:
      - "${CLOUD_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health').status == 200"]
      interval: 15s
      timeout: 5s
      retries: 5
    secrets: [cloud_database_url]
    networks: [cloud_database, cloud_egress]

networks:
  cloud_database:
    internal: true
  # Cloud 可从该网络访问官方法规来源；PostgreSQL 不加入此网络。
  cloud_egress: {}

secrets:
  postgres_password:
    external: true
  cloud_database_url:
    external: true

volumes:
  cloud_postgres_data:
