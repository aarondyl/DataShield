services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: datashield_cloud
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: datashield_cloud
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashield_cloud -d datashield_cloud"]
      interval: 5s
      timeout: 3s
      retries: 12
    secrets: [postgres_password]
    networks: [cloud_database]
    restart: unless-stopped
    mem_limit: 450m
    logging: &json_logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # 故意不发布宿主机端口：生产数据库只能由 cloud 服务访问。

  cloud:
    # Production must set CLOUD_IMAGE to a registry digest, for example
    # registry.example/datashield-cloud@sha256:... and use `up --no-build`.
    # The local default keeps the Compose file usable for non-production tests.
    image: ${CLOUD_IMAGE:-datashield-cloud:local}
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    environment:
      DATABASE_URL_FILE: /run/secrets/cloud_database_url
      RUNTIME_MODE: cloud
      RUN_SEED: "false"
      # The Cloud runtime owns only public legal sources; the scheduler performs
      # one low-concurrency warm-up poll after startup and then daily refreshes.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      CLOUD_ADMIN_TOKEN_FILE: /run/secrets/cloud_admin_token
      DATASHIELD_RELEASE_SHA: ${DATASHIELD_RELEASE_SHA:-unknown}
    labels:
      org.opencontainers.image.revision: ${DATASHIELD_RELEASE_SHA:-unknown}
    ports:
      - "${CLOUD_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - cloud_regintel_snapshots:/app/data/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from urllib.request import urlopen; r=urlopen('http://127.0.0.1:8000/api/health'); d=json.load(r); assert r.status == 200 and d['status'] == 'ok' and d['db'] == 'postgresql'"]
      interval: 15s
      timeout: 5s
      retries: 5
    secrets: [cloud_database_url, cloud_admin_token]
    networks: [cloud_database, cloud_egress, cloud_api]
    restart: unless-stopped
    mem_limit: 400m
    logging: *json_logging

  identity:
    profiles: [identity]
    image: ${IDENTITY_IMAGE:-datashield-identity:local}
    build:
      context: ./backend
      dockerfile: Dockerfile.identity
    environment:
      IDENTITY_DATABASE_URL_FILE: /run/secrets/identity_database_url
      IDENTITY_EMAIL_VERIFY_REQUIRED: ${IDENTITY_EMAIL_VERIFY_REQUIRED:-true}
      IDENTITY_SMTP_HOST: ${IDENTITY_SMTP_HOST:-}
      IDENTITY_SMTP_PORT: ${IDENTITY_SMTP_PORT:-587}
      IDENTITY_SMTP_USER: ${IDENTITY_SMTP_USER:-}
      IDENTITY_SMTP_PASSWORD_FILE: /run/secrets/identity_smtp_password
      IDENTITY_EMAIL_FROM: ${IDENTITY_EMAIL_FROM:-}
      IDENTITY_SMTP_STARTTLS: ${IDENTITY_SMTP_STARTTLS:-true}
      IDENTITY_LLM_API_KEY_FILE: /run/secrets/identity_llm_api_key
      IDENTITY_LLM_MODEL: ${IDENTITY_LLM_MODEL:-deepseek-flash}
      DATASHIELD_RELEASE_SHA: ${DATASHIELD_RELEASE_SHA:-unknown}
    labels:
      org.opencontainers.image.revision: ${DATASHIELD_RELEASE_SHA:-unknown}
    ports:
      - "${IDENTITY_BIND_ADDRESS:-127.0.0.1}:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from urllib.request import urlopen; d=json.load(urlopen('http://127.0.0.1:8001/health')); assert d['status'] == 'ok' and d['database'] == 'postgresql' and d['email_delivery_ready']"]
      interval: 15s
      timeout: 5s
      retries: 5
    secrets: [identity_database_url, identity_smtp_password, identity_llm_api_key]
    networks: [cloud_database, cloud_egress, cloud_api]
    restart: unless-stopped
    mem_limit: 192m
    logging: *json_logging

  gateway:
    profiles: [production]
    image: ${PROXY_IMAGE:-datashield-cloud-proxy:local}
    build:
      context: ./deploy/proxy
      dockerfile: Dockerfile
    environment:
      CLOUD_DOMAIN: ${CLOUD_DOMAIN:-api.datashield.ltd}
    ports:
      - "${CLOUD_HTTP_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${CLOUD_HTTPS_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cloud:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks: [cloud_api, cloud_egress]
    restart: unless-stopped
    mem_limit: 80m
    logging: *json_logging

networks:
  cloud_database:
    internal: true
  # Cloud 可从该网络访问官方法规来源；PostgreSQL 不加入此网络。
  cloud_egress: {}
  # Reverse proxy can reach APIs but cannot access PostgreSQL.
  cloud_api:
    internal: true

secrets:
  postgres_password:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/postgres_password
  cloud_database_url:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/cloud_database_url
  cloud_admin_token:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/cloud_admin_token
  identity_database_url:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/identity_database_url
  identity_smtp_password:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/identity_smtp_password
  identity_llm_api_key:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/identity_llm_api_key

volumes:
  cloud_postgres_data:
  cloud_regintel_snapshots:
  caddy_data:
  caddy_config:
