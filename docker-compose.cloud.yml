services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: datashield_cloud
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: datashield_cloud
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashield_cloud -d datashield_cloud"]
      interval: 5s
      timeout: 3s
      retries: 12
    secrets: [postgres_password]
    networks: [cloud_database]
    restart: unless-stopped
    mem_limit: 700m
    logging: &json_logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # 故意不发布宿主机端口：生产数据库只能由 cloud 服务访问。

  cloud:
    # Production must set CLOUD_IMAGE to a registry digest, for example
    # registry.example/datashield-cloud@sha256:... and use `up --no-build`.
    # The local default keeps the Compose file usable for non-production tests.
    image: ${CLOUD_IMAGE:-datashield-cloud:local}
    build:
      context: .
      dockerfile: backend/Dockerfile.cloud
    environment:
      DATABASE_URL_FILE: /run/secrets/cloud_database_url
      RUNTIME_MODE: cloud
      RUN_SEED: "false"
      # The Cloud runtime owns only public legal sources; the scheduler performs
      # one low-concurrency warm-up poll after startup and then daily refreshes.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      CLOUD_ADMIN_TOKEN_FILE: /run/secrets/cloud_admin_token
    ports:
      - "${CLOUD_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - cloud_regintel_snapshots:/app/data/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health').status == 200"]
      interval: 15s
      timeout: 5s
      retries: 5
    secrets: [cloud_database_url, cloud_admin_token]
    networks: [cloud_database, cloud_egress]
    restart: unless-stopped
    mem_limit: 550m
    logging: *json_logging

  identity:
    build:
      context: .
      dockerfile: backend/Dockerfile.identity
    environment:
      IDENTITY_DATABASE_URL_FILE: /run/secrets/identity_database_url
      IDENTITY_EMAIL_VERIFY_REQUIRED: "true"
      IDENTITY_SMTP_HOST: ${IDENTITY_SMTP_HOST:?Set the account email SMTP host}
      IDENTITY_SMTP_PORT: ${IDENTITY_SMTP_PORT:-587}
      IDENTITY_SMTP_USER: ${IDENTITY_SMTP_USER:?Set the account email SMTP username}
      IDENTITY_SMTP_PASSWORD_FILE: /run/secrets/identity_smtp_password
      IDENTITY_EMAIL_FROM: ${IDENTITY_EMAIL_FROM:?Set the verified DataShield sender address}
      IDENTITY_SMTP_STARTTLS: "true"
    ports:
      - "${IDENTITY_BIND_ADDRESS:-127.0.0.1}:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8001/health').status == 200"]
      interval: 15s
      timeout: 5s
      retries: 5
    secrets: [identity_database_url, identity_smtp_password]
    networks: [cloud_database, cloud_egress]
    restart: unless-stopped
    mem_limit: 260m
    logging: *json_logging

networks:
  cloud_database:
    internal: true
  # Cloud 可从该网络访问官方法规来源；PostgreSQL 不加入此网络。
  cloud_egress: {}

secrets:
  postgres_password:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/postgres_password
  cloud_database_url:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/cloud_database_url
  cloud_admin_token:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/cloud_admin_token
  identity_database_url:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/identity_database_url
  identity_smtp_password:
    file: ${CLOUD_SECRETS_DIR:?Set CLOUD_SECRETS_DIR to an absolute, deploy-user-only directory}/identity_smtp_password

volumes:
  cloud_postgres_data:
  cloud_regintel_snapshots:
